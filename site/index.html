<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lurent — soft abstract wallpapers for your Mac</title>
<meta name="description" content="Lurent turns a photograph into a soft abstract wallpaper — blur, gradient, mirror, slats. Pick a picture, shape it with the effect controls, set it as your desktop, at your display's native resolution up to Pro Display XDR. Native macOS app, free.">
<link rel="icon" href="/favicon.png">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #0071e3;
    --accent-hover: #0077ed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161617;
      --text: #f5f5f7;
      --muted: #a1a1a6;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    min-height: 100svh;
    display: grid;
    place-items: center;
  }

  /* Soft blurred gradient backdrop — the product, as the hero.
     Colors follow the app icon: violet / pink / orange. */
  .backdrop {
    position: fixed; inset: 0; z-index: -1; overflow: hidden;
    filter: blur(90px) saturate(1.05);
    opacity: .75;
  }
  @media (prefers-color-scheme: dark) { .backdrop { opacity: .4; } }
  .blob { position: absolute; border-radius: 50%; }
  .b1 { width: 55vw; height: 55vw; left: -12vw; top: -18vw; background: #959ab3; }
  .b2 { width: 48vw; height: 48vw; right: -10vw; top: 2vw;  background: #ebcfc4; }
  .b3 { width: 52vw; height: 52vw; left: 20vw; bottom: -24vw; background: #ddb3a5; }

  main {
    text-align: center;
    padding: 3rem 1.5rem;
    max-width: 40rem;
  }

  .links {
    margin-top: 2.4rem;
    font-size: .95rem;
    color: var(--muted);
  }
  .links a { color: var(--muted); text-decoration: none; }
  .links a:hover { color: var(--text); text-decoration: underline; }
  .links span { margin: 0 .5rem; opacity: .5; }

  .icon {
    width: 116px; height: 116px;
    margin: 0 auto 1.3rem;
    display: block;
    /* The gloss and the edge lighting are baked into the file — only macOS can
       render those. The shadow stays in CSS so it holds up on any display and can
       differ between light and dark. */
    filter: drop-shadow(0 12px 24px rgba(60, 50, 70, .22))
            drop-shadow(0 3px 6px rgba(60, 50, 70, .14));
  }
  @media (prefers-color-scheme: dark) {
    .icon {
      filter: drop-shadow(0 14px 30px rgba(0, 0, 0, .55))
              drop-shadow(0 3px 8px rgba(0, 0, 0, .40));
    }
  }

  h1 {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    font-size: clamp(2.4rem, 6vw, 3.4rem);
    font-weight: 700;
    letter-spacing: -.02em;
  }
  .tagline {
    margin-top: .7rem;
    font-size: clamp(1.05rem, 2.6vw, 1.3rem);
    line-height: 1.45;
    color: var(--muted);
    font-weight: 400;
  }

</style>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  </div>

  <main>
    <img class="icon" src="icon.png" alt="" width="116" height="116">
    <h1>Lurent</h1>
    <p class="tagline">Turns a photograph into a soft abstract wallpaper.<br>
    Endless variations, at your display's native resolution.</p>

    <p class="links">
      <a href="/support">Support</a><span>·</span><a href="/privacy">Privacy</a>
    </p>
  </main>
</body>
</html>
