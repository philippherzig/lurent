<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #0071e3;
    --accent-hover: #0077ed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161617;
      --text: #f5f5f7;
      --muted: #a1a1a6;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    min-height: 100svh;
    display: grid;
    place-items: center;
  }

  /* Soft blurred gradient backdrop — the product, as the hero.
     Colors follow the app icon: violet / pink / orange. */
  .backdrop {
    position: fixed; inset: 0; z-index: -1; overflow: hidden;
    filter: blur(90px) saturate(1.15);
    opacity: .5;
  }
  @media (prefers-color-scheme: dark) { .backdrop { opacity: .33; } }
  .blob { position: absolute; border-radius: 50%; }
  .b1 { width: 55vw; height: 55vw; left: -12vw; top: -18vw; background: #a13de0; }
  .b2 { width: 48vw; height: 48vw; right: -10vw; top: 2vw;  background: #ff2f8e; }
  .b3 { width: 52vw; height: 52vw; left: 20vw; bottom: -24vw; background: #ffa029; }

  main {
    text-align: center;
    padding: 3rem 1.5rem;
    max-width: 40rem;
  }

  .icon {
    width: 116px; height: 116px;
    margin: 0 auto 1.3rem;
    display: block;
  }

  h1 {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    font-size: clamp(2.4rem, 6vw, 3.4rem);
    font-weight: 700;
    letter-spacing: -.02em;
  }
  .tagline {
    margin-top: .7rem;
    font-size: clamp(1.05rem, 2.6vw, 1.3rem);
    line-height: 1.45;
    color: var(--muted);
    font-weight: 400;
  }

  .cta { margin-top: 2.2rem; }
  .btn {
    display: inline-flex; align-items: center; gap: .55rem;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-size: 1.06rem; font-weight: 500;
    padding: .78rem 1.7rem;
    border-radius: 980px;            /* Apple pill */
    transition: background .15s ease, transform .05s ease;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: scale(.985); }
  .btn svg { width: 1.05em; height: 1.05em; }
</style>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
